name: Isolated regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      CQ_V2_TEST_PYTHON: python
      CQ_V2_TEST_WORD: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - run: python -m pip install -r scripts/requirements-test.txt
      - name: Configure isolated document test runtime
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          runtime = Path('private/v2-local/runtime.json')
          runtime.parent.mkdir(parents=True, exist_ok=True)
          runtime.write_text(json.dumps({'python': sys.executable}), encoding='utf-8')
          PY
      - run: npm run test:serial
      - name: Verification limits
        if: always()
        run: echo 'Synthetic fixtures only. Real Microsoft Word export and authenticated browser acceptance remain local checks; no private artifacts are uploaded.' >> "$GITHUB_STEP_SUMMARY"
